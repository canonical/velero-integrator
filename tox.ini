[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint, unit, integration, integration-e2e, update-requirements
min_version = 4.0.0

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
velero_lib_path = {tox_root}/lib/charms/velero_libs
all_path = {[vars]src_path} {[vars]tests_path} {[vars]velero_lib_path}

[testenv]
allowlist_externals = poetry
deps =
    poetry>=2.1.3
set_env =
    PYTHONPATH = {tox_root}:{tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS

[testenv:update-requirements]
description = Update the locked dependencies in poetry.lock
commands =
    poetry lock

[testenv:format]
description = Apply coding style standards to code
commands_pre =
    poetry install --only fmt
commands =
    ruff format {[vars]all_path}
    ruff check --fix {[vars]all_path}
    black {[vars]all_path}

[testenv:fmt]
description = Alias for format (backwards compatibility)
commands_pre = {[testenv:format]commands_pre}
commands = {[testenv:format]commands}

[testenv:lint]
description = Check code against coding style standards
commands_pre =
    poetry install --only lint,charm
commands =
    codespell {tox_root} \
        --skip {tox_root}/poetry.lock \
        --skip {tox_root}/venv \
        --skip {tox_root}/.tox \
        --skip {tox_root}/.git \
        --skip {tox_root}/build \
        --skip "*.pdf"
    ruff check {[vars]all_path}
    ruff format --check --diff {[vars]all_path}
    black --check {[vars]all_path}
    pyright {posargs}

[testenv:unit]
description = Run unit tests
commands_pre =
    poetry install --only unit,charm
commands =
    coverage run --source={[vars]src_path} \
                 -m pytest \
                 --tb native \
                 -v \
                 -s \
                 {posargs} \
                 {[vars]tests_path}/unit
    coverage report
    coverage xml

[testenv:integration]
description = Run integration tests
pass_env =
    CI
    CHARM_PATH
    TEST_APP_CHARM_PATH
commands_pre =
    poetry install --only integration
commands =
    pytest -v \
           -s \
           -x \
           --tb native \
           --log-cli-level=INFO \
           {posargs} \
           {[vars]tests_path}/integration/test_charm.py

[testenv:integration-e2e]
description = Run end-to-end integration tests
pass_env =
    CI
    AWS_ACCESS_KEY
    AWS_SECRET_KEY
    AWS_BUCKET
    AWS_ENDPOINT
    AWS_S3_URI_STYLE
    AWS_REGION
    CHARM_PATH
    TEST_APP_CHARM_PATH
commands_pre =
    poetry install --only integration
commands =
    pytest -v \
           -s \
           -x \
           --tb native \
           --log-cli-level=INFO \
           {posargs} \
           {[vars]tests_path}/integration/test_e2e.py
